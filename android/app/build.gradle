plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.cyber.cyber"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }    

    defaultConfig {
        applicationId = "com.cyber.cyber"
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "❌ [Signing Error] 'android/key.properties' file not found.\n" +
                    "Please create 'android/key.properties' from 'android/key.properties.example' and configure your keystore credentials."
                )
            }

            def keystoreFile = keystoreProperties['storeFile']
            if (!keystoreFile || !keystoreProperties['storePassword'] || !keystoreProperties['keyAlias'] || !keystoreProperties['keyPassword']) {
                throw new GradleException(
                    "❌ [Signing Error] 'android/key.properties' is missing required fields (storePassword, keyPassword, keyAlias, storeFile)."
                )
            }

            def resolvedStoreFile = file(keystoreFile).exists() ? file(keystoreFile) : rootProject.file(keystoreFile)
            if (!resolvedStoreFile.exists()) {
                throw new GradleException(
                    "❌ [Signing Error] Keystore file '${keystoreFile}' not found in android/app/ or android/ directory."
                )
            }

            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = resolvedStoreFile
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

flutter {
    source = "../.."
}
